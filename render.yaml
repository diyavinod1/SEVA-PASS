
# ==============================================================================
# SEVA PASS — Render Blueprint
# Services:
#   1. seva-pass-api: FastAPI Backend
#   2. seva-pass-ui: React + Vite Static Frontend
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: seva-pass-api
    runtime: python
    rootDir: backend

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health
    plan: free
    autoDeploy: false

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: DB_MODE
        value: supabase

      - key: KEY_ID
        value: seva-ed25519-v1

      # Supabase Configuration
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      # Ed25519 Signing Key
      - key: ED25519_PRIVATE_KEY_HEX
        sync: false

      # JWT Secret
      - key: JWT_SECRET
        generateValue: true

      # Frontend URL for CORS
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: seva-pass-ui
          property: url

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend
  # ----------------------------------------------------------------------------
  - type: web
    name: seva-pass-ui
    runtime: static
    rootDir: frontend

    buildCommand: npm install && npm run build
    staticPublishPath: dist

    plan: free
    autoDeploy: false

    # React SPA Routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Backend API URL
      - key: VITE_API_URL
        fromService:
          type: web
          name: seva-pass-api
          property: url

      # Public Supabase Configuration
      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false

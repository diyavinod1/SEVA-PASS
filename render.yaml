
# ==============================================================================
# SEVA PASS — Render Blueprint
# ==============================================================================

services:

  # 1. FastAPI Backend
  - type: web
    name: seva-pass-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: false

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_MODE
        value: supabase
      - key: KEY_ID
        value: seva-ed25519-v1

      # Supabase credentials
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

      # Cryptographic signing key
      - key: ED25519_PRIVATE_KEY_HEX
        sync: false

      # JWT secret
      - key: JWT_SECRET
        generateValue: true

      # Frontend CORS origin
      - key: CORS_ORIGINS
        value: https://seva-pass-ui.onrender.com

      # Administrator password
      - key: SEVA_ADMIN_PASS
        sync: false

  # 2. React + Vite Static Frontend
  - type: web
    name: seva-pass-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://seva-pass-api.onrender.com

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false
